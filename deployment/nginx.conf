# Install as /etc/nginx/sites-available/leo-learn and enable with a symlink
# in /etc/nginx/sites-enabled/. Ubuntu includes these files in the http context.
# Do NOT replace /etc/nginx/nginx.conf with this file.

map $http_upgrade $leo_learn_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;

    # Replace these example names with your actual hostname(s).
    server_name example.com www.example.com;

    access_log /var/log/nginx/leo-learn.access.log;
    error_log /var/log/nginx/leo-learn.error.log;

    # Suitable for the existing demo; revisit for future uploads / Server Actions.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $leo_learn_connection_upgrade;

        # Let Next.js control response caching; preserve streaming responses.
        proxy_cache off;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
