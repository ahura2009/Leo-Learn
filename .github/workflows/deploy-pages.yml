name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v5
      # Pages سرور ندارد؛ مسیر پراکسی /v1 فقط در استقرار سروری لازم است.
      - run: rm -rf "app/v1"
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /Leo-Learn
          # اختیاری: پس از استقرار بک‌اند auth، این مقدار را در
          # Settings → Secrets and variables → Actions → Variables بسازید.
          NEXT_PUBLIC_AUTH_API_URL: ${{ vars.NEXT_PUBLIC_AUTH_API_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v4
